<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로그인</title>
<style>
    body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #f5f5f5;
    }
    .login-box {
        background: #fff;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        width: 320px;
    }
    .login-box h1 {
        font-size: 1.25rem;
        margin-bottom: 1rem;
        text-align: center;
    }
    .login-box p.errorlist {
        color: #d33;
        font-size: 0.9rem;
    }
    .login-box label {
        display: block;
        margin-top: 0.75rem;
        font-size: 0.9rem;
    }
    .login-box input {
        width: 100%;
        padding: 0.5rem;
        margin-top: 0.25rem;
        box-sizing: border-box;
    }
    .login-box button {
        width: 100%;
        margin-top: 1.25rem;
        padding: 0.6rem;
        background: #333;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
</style>
</head>
<body>
<div class="login-box">
    <h1>로그인</h1>

    {% if form.errors %}
        <p class="errorlist">아이디 또는 비밀번호가 올바르지 않습니다.</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <label for="id_username">아이디</label>
        <input type="text" name="username" id="id_username" autofocus required>

        <label for="id_password">비밀번호</label>
        <input type="password" name="password" id="id_password" required>

        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">로그인</button>
    </form>
</div>

<script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get("required") === "1") {
            alert("로그인 후 이용해주세요");
        }
    })();
</script>
</body>
</html>
