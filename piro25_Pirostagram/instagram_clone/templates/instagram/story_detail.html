<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ story.author.username }}님의 스토리</title>
    <style>
        body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .story-wrapper { position: relative; width: 360px; height: 640px; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; }
        .story-slide { display: none; width: 100%; height: 100%; object-fit: contain; }
        .story-slide.active { display: block; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.3); border: none; color: white; padding: 10px; cursor: pointer; border-radius: 50%; font-size: 18px; }
        .prev { left: 10px; }
        .next { right: 10px; }
        .close-btn { position: absolute; top: 15px; right: 15px; color: white; text-decoration: none; font-size: 20px; }
        .author-tag { position: absolute; top: 15px; left: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="story-wrapper">
        <div class="author-tag">{{ story.author.username }}</div>
        <a href="{% url 'feed' %}" class="close-btn">✕</a>

        {% for img_obj in story.images.all %}
            <img src="{{ img_obj.image.url }}" class="story-slide {% if forloop.first %}active{% endif %}" alt="story-img">
        {% endfor %}

        <button class="nav-btn prev" onclick="moveSlide(-1)">❮</button>
        <button class="nav-btn next" onclick="moveSlide(1)">❯</button>
    </div>

    <script>
        let currentIdx = 0;
        const slides = document.querySelectorAll('.story-slide');

        function moveSlide(direction) {
            slides[currentIdx].classList.remove('active');
            currentIdx += direction;

            if (currentIdx < 0) {
                currentIdx = 0;
            } else if (currentIdx >= slides.length) {
                location.href = "{% url 'feed' %}";
                return;
            }

            slides[currentIdx].classList.add('active');
        }
    </script>
</body>
</html>
