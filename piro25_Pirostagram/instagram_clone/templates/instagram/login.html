<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Instagram - 로그인</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #fafafa; }
        .login-box { border: 1px solid #dbdbdb; padding: 40px; background: white; text-align: center; width: 300px; border-radius: 4px; }
        .login-input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #dbdbdb; border-radius: 4px; box-sizing: border-box; }
        .login-btn { width: 100%; padding: 10px; background-color: #0095f6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Instagram</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" class="login-input" placeholder="사용자 이름 (테스트용 ID)" required>
            <button type="submit" class="login-btn">로그인</button>
        </form>
        <p style="font-size: 12px; color: #8e8e8e; margin-top: 20px;">없는 ID를 입력하면 자동으로 회원가입 후 로그인됩니다.</p>
    </div>
</body>
</html>
