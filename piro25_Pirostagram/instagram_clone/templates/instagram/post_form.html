<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{% if post %}게시글 수정{% else %}새 게시글 작성{% endif %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #dbdbdb; border-radius: 4px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-control { width: 100%; padding: 8px; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 10px; background: #0095f6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>{% if post %}게시글 수정{% else %}새 게시글 작성{% endif %}</h2>
    <form method="POST" action="" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="image">이미지 선택</label>
            {% if post %}
                <p style="font-size:12px; color:#8e8e8e;">기존 파일: <a href="{{ post.image.url }}" target="_blank">보기</a> (변경할 때만 새로 선택)</p>
            {% endif %}
            <input type="file" id="image" name="image" class="form-control" {% if not post %}required{% endif %}>
        </div>
        <div class="form-group">
            <label for="content">문구 입력</label>
            <textarea id="content" name="content" class="form-control" rows="4" placeholder="문구를 입력하세요...">{% if post %}{{ post.content }}{% endif %}</textarea>
        </div>
        <button type="submit" class="submit-btn">{% if post %}수정 완료{% else %}공유하기{% endif %}</button>
    </form>
    <p style="text-align: center; margin-top: 15px;"><a href="{% url 'feed' %}" style="color: #8e8e8e;">취소</a></p>
</body>
</html>
